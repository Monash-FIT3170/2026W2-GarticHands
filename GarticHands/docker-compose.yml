name: gartichands

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: gartichands-server:local
    environment:
      NODE_ENV: production
      PORT: "3000"
    # Exposed on the host for debugging only. The web app reaches the server
    # through the nginx proxy (same-origin), not this port.
    ports:
      - "${SERVER_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [gartic]
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # Empty = same-origin; the browser calls /rooms via the nginx proxy.
        VITE_API_URL: "${VITE_API_URL:-}"
    image: gartichands-client:local
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [gartic]
    restart: unless-stopped

networks:
  gartic:
    driver: bridge

# No named volumes: rooms are in-memory by design, so there is no persistent
# state to mount. A server restart intentionally clears all rooms.
