# Serves the built SPA and reverse-proxies dynamic traffic to the server
# container so the browser only ever talks to one origin (no CORS).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PNG data URLs from the drawing canvas can be a few hundred KB.
    client_max_body_size 12m;

    # REST rooms API -> server container. No trailing slash: original URI is
    # forwarded unchanged (e.g. /rooms/create -> server:3000/rooms/create).
    location /rooms {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO (WebSocket upgrade) -> server container.
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback: every other path serves index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
