name: Component Tests

# Runs on every PR targeting main
on:
  pull_request:
    branches:
      - main

jobs:
  component-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GarticHands

    steps:
      # Step 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2) Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: GarticHands/package-lock.json

      # Step 3) Install root workspace deps (covers client via workspaces)
      - name: Install dependencies
        run: npm ci

      # Step 4) Run component tests from client/
      - name: Run component tests
        working-directory: GarticHands/client
        run: npm run test:component

