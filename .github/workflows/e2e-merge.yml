name: E2E Tests

# Runs on every push to main (i.e. after a PR is merged)
on:
  push:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GarticHands

    steps:
      # Step 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2) Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: GarticHands/package-lock.json

      # Step 3) Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4) Install Playwright browsers + OS deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Step 5) Run e2e tests
      - name: Run E2E tests
        run: npm run test:e2e

      # Step 6) Upload the HTML report as a build artifact so it can be
      # downloaded/viewed even after the run finishes, especially on failure
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: GarticHands/e2e-tests/playwright-report
          retention-days: 14