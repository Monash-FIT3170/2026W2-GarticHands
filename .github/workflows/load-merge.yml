name: Load Testing

# Runs on every push to main (i.e. after a PR is merged)
on:
  push:
    branches:
      - main

jobs:
  load-testing:
    runs-on: ubuntu-latest

    steps:
      # Step 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2) Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: GarticHands/package-lock.json

      # Step 3) Install root workspace deps (covers server via workspaces)
      - name: Install server dependencies
        working-directory: GarticHands
        run: npm ci

      # Step 4) Install load-testing's own deps (separate package.json/lockfile)
      # NOTE: only strictly needed if the k6 scripts import local npm packages.
      # Safe to keep even if unused, but remove if it's just for linting.
      - name: Install load-testing dependencies
        working-directory: GarticHands/load-testing
        run: npm ci

      # Step 5) Install k6 binary on the runner
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # Step 6) Start the server in the background
      - name: Start server
        working-directory: GarticHands/server
        run: nohup npm run dev > server.log 2>&1 &

      # Step 7) Wait for server to be ready before hitting it with k6
      # No dedicated /health route, so just poll the base URL until it
      # responds (any HTTP response, even a 404, means the port is up).
      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            status="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)"
            if echo "$status" | grep -qE "^[0-9]{3}$"; then
              echo "Server is up"
              exit 0
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done
          echo "Server did not become ready in time"
          cat GarticHands/server/server.log
          exit 1

      # Step 8) Run each load test scenario
      - name: Run load test - five-player-game
        working-directory: GarticHands
        run: k6 run load-testing/scenarios/five-player-game.js

      - name: Run load test - late-player-join
        working-directory: GarticHands
        run: k6 run load-testing/scenarios/late-player-join.js

      - name: Run load test - multiple-simultaneous-games
        working-directory: GarticHands
        run: k6 run load-testing/scenarios/multiple-simultaneous-games.js

      - name: Run load test - six-player-two-groups
        working-directory: GarticHands
        run: k6 run load-testing/scenarios/six-player-two-groups.js

